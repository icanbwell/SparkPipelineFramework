# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The release is published to PyPI with twine; nothing is pushed back to git
        # (the VERSION write below stays local to the build), so the checkout token
        # must not be left behind in .git/config.
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set release tag in VERSION
      run: |
        echo "${{ github.event.release.tag_name }}" > VERSION

      # The helix.spark base image lives in the private services-account ECR
      # (CIE-8032), so docker must authenticate before any build. This repo is PUBLIC
      # and runs on GitHub-hosted runners, so it has no ambient AWS identity the way
      # helix.pipelines does (that relies on its self-hosted runner's IRSA role).
      # We therefore use a dedicated read-only IAM user's access key, matching the
      # pattern helix.pipelines already uses for the dev account.
      #
      # PREREQUISITE: the SERVICES_ECR_ACCESS_KEY_ID / SERVICES_ECR_SECRET_ACCESS_KEY
      # org secrets must be scoped to this repo. Fork pull requests receive no secrets,
      # so external-contributor PRs cannot build these images.
    - name: AWS Credentials (services account, for helix.spark base image pull)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        aws-access-key-id: ${{ secrets.SERVICES_ECR_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.SERVICES_ECR_SECRET_ACCESS_KEY }}

    - name: Login to Amazon ECR (services)
      uses: aws-actions/amazon-ecr-login@v2
      with:
        skip-logout: true

      # setup and install everything and run tests
    - name: build docker
      run: docker compose build --parallel

    - name: Build and publish package with Docker Compose
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI }}
      run: |
        docker compose run --rm -e TWINE_USERNAME=${TWINE_USERNAME} -e TWINE_PASSWORD=${TWINE_PASSWORD} dev sh -c "
          pip install twine wheel build &&
          python -m build &&
          twine upload dist/*
        "

    - name: list files in dist
      run: ls -haltR dist

    - name: Persist wheels directory
      uses: actions/upload-artifact@v4
      with:
        name: wheel_${{ github.event.release.tag_name }}
        path: dist/*.whl  # Only upload wheel files
        if-no-files-found: error
